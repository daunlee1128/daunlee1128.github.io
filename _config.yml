# 사이트 메타
title: daunlee1128
handle: daunlee1128
tagline: backend · ai gateway · llmops
description: 만들고 운영하며 남긴 기록 — 설계 · 설정 · 구현 · 운영 · 문제 해결, 그리고 인사이트
url: "https://daunlee1128.github.io"
baseurl: ""
github_url: "https://github.com/daunlee1128"
lang: ko
timezone: Asia/Seoul
# 게시 = 파일을 컬렉션으로 옮기는 행위. date 는 예약이 아니라 메타데이터 → 미래 날짜여도 빌드한다 (기본 false 면 조용히 사라짐)
future: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  tech:
    output: true
    permalink: /tech/:name/
  insights:
    output: true
    permalink: /insights/:name/

defaults:
  - scope: { path: "", type: tech }
    values: { layout: post, type: tech, section: tech }
  - scope: { path: "", type: insights }
    values: { layout: post, type: insights, section: insights }
  # stack/ 은 어느 탭에도 속하지 않는다 — 헤더의 '글' 탭이 활성되지 않도록 section 을 준다
  - scope: { path: "stack" }
    values: { section: stack }

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

exclude:
  - drafts
  - scripts
  - Gemfile
  - Gemfile.lock
  - README.md
  - .githooks
  - .denylist
  - vendor
