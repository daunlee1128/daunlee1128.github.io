<header class="hd desktop-only">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.handle }}<small>{{ site.tagline }}</small></a>
  <nav class="tabs">
    <a class="{% if page.section == "" or page.section == nil %}on{% endif %}" href="{{ '/' | relative_url }}">글</a>
    <a class="{% if page.section == "tech" %}on{% endif %}" href="{{ '/tech/' | relative_url }}">기술</a>
    <a class="{% if page.section == "insights" %}on{% endif %}" href="{{ '/insights/' | relative_url }}">인사이트</a>
    <a class="{% if page.section == "about" %}on{% endif %}" href="{{ '/about/' | relative_url }}">About</a>
  </nav>
  <div class="util">
    <a class="ibtn" href="{{ site.github_url }}" rel="me">{{ svg_gh }}GitHub</a>
    <a class="ibtn" href="{{ '/feed.xml' | relative_url }}">RSS</a>
    {{ svg_toggle }}
  </div>
</header>
<div class="mhd mobile-only">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.handle }}</a>
  <span style="margin-left:auto;display:flex;gap:var(--sp-2)"><a class="ibtn icon" href="{{ site.github_url }}" aria-label="GitHub">{{ svg_gh }}</a>{{ svg_toggle }}</span>
</div>
<nav class="mtabs mobile-only">
  <a class="{% if page.section == "" or page.section == nil %}on{% endif %}" href="{{ '/' | relative_url }}">글</a>
  <a class="{% if page.section == "tech" %}on{% endif %}" href="{{ '/tech/' | relative_url }}">기술</a>
  <a class="{% if page.section == "insights" %}on{% endif %}" href="{{ '/insights/' | relative_url }}">인사이트</a>
  <a class="{% if page.section == "about" %}on{% endif %}" href="{{ '/about/' | relative_url }}">About</a>
</nav>
