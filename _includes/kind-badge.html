{%- assign p = include.post -%}
{%- if p.collection == "insights" -%}
<span class="badge soft" style="--kb:var(--amber-3);--kt:var(--amber-11)">인사이트</span>
{%- else -%}
{%- assign k = site.data.kinds | where: "slug", p.kind | first -%}
<span class="badge soft" style="--kb:var({{ k.bg | default: '--gray-4' }},var(--gray-4));--kt:var({{ k.fg | default: '--gray-11' }},var(--gray-11))">{{ k.name | default: p.kind | default: "?" }}</span>
{%- endif -%}
