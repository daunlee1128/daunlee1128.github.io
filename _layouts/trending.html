<!doctype html>
<html lang="{{ site.lang }}">
<head>
{% include head.html %}
<style>
/* 리포트는 self-contained HTML — iframe 으로 격리해 사이트 CSS 와 섞이지 않게 한다.
   높이는 리포트 내용에 맞춰 늘리고 스크롤은 페이지가 한다(iframe 내부 스크롤 금지) —
   100dvh 고정이면 모바일에서 주소창이 접히지 않고 헤더 94px 이 영구히 화면을 먹는다. */
.rpt{display:block;width:100%;border:0}
.tback{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);
  border-bottom:1px solid var(--gray-6);color:var(--gray-11);font-size:var(--fs-2)}
.tback a{color:var(--gray-11);text-decoration:none}
.tback a:hover{color:var(--gray-12)}
</style>
</head>
<body>
{% include header.html %}
<nav class="tback"><a href="{{ '/github-trending/' | relative_url }}">‹ GitHub Trending</a></nav>
<iframe class="rpt" id="rpt" src="{{ page.report | relative_url }}" title="{{ page.title }}" scrolling="no"></iframe>
<script>
(function () {
  var f = document.getElementById('rpt'), root = document.documentElement;

  // 블로그 토큰 + 브리지를 리포트 문서에 주입한다. 리포트 원본은 그대로다 —
  // 단독으로 열면 원래 shadcn 테마로 보인다.
  function inject(d) {
    ['{{ "/assets/tokens.css" | relative_url }}',
     '{{ "/assets/trending-bridge.css" | relative_url }}'].forEach(function (href) {
      var l = d.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      d.head.appendChild(l);   // 리포트 <style> 뒤에 와야 같은 :root 특정성에서 이긴다
    });
  }

  function syncTheme(d) {
    d.documentElement.classList.toggle('dark', root.classList.contains('dark'));
  }

  // 리포트 높이에 iframe 을 맞춘다. 카드를 펼치면 높이가 변하므로 계속 따라간다.
  function fit(d) {
    var h = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
    if (h) f.style.height = h + 'px';
  }

  f.addEventListener('load', function () {
    var d;
    try { d = f.contentDocument; } catch (e) { return; }   // 같은 도메인이라 정상적으론 안 난다
    if (!d) return;
    inject(d);
    syncTheme(d);
    fit(d);
    if (window.ResizeObserver) new ResizeObserver(function () { fit(d); }).observe(d.documentElement);
    d.addEventListener('toggle', function () { setTimeout(function () { fit(d); }, 0); }, true);
    // 헤더의 테마 토글은 부모 <html> 의 class 만 바꾼다 — 그 변화를 보고 따라간다
    new MutationObserver(function () { syncTheme(d); })
      .observe(root, { attributes: true, attributeFilter: ['class'] });
  });
})();
</script>
</body>
</html>
